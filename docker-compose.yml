name: meetcore-app

services:
  db:
    image: postgres:18-alpine
    container_name: meetcore-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-meetcore_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-meetcore_pass}
      - POSTGRES_DB=${POSTGRES_DB:-meetcore_db}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetcore_user} -d ${POSTGRES_DB:-meetcore_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: meetcore-backend
    container_name: meetcore-backend
    ports:
      - "${BACK_PORT:-8080}:8080"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-meetcore_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-meetcore_pass}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/meetcore_db}
    depends_on:
      db:
        condition: service_healthy